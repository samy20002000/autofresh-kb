<style>
/* Layout : sommaire collant à gauche (sections, puis thèmes des réponses), contenu en colonne de lecture ; une colonne sur téléphone */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --fg: #1d2421; --muted: #5d6a64; --line: #dde3df;
  --accent: #2f6b55; --accent-soft: #e3efe9;
  --warn: #9a5b12; --warn-soft: #f8ecd9; --info: #2c5a8a; --info-soft: #e2ecf6; --good: #2f6b3a; --good-soft: #e1f0e3;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --surface: #1c2320; --fg: #e4ebe7; --muted: #9aa8a1; --line: #2e3833;
  --accent: #7cc4a6; --accent-soft: #1f3a2f;
  --warn: #e2ac62; --warn-soft: #3a2c19; --info: #8db8e6; --info-soft: #1d2c3d; --good: #8fcf98; --good-soft: #1d3322; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --fg: #e4ebe7; --muted: #9aa8a1; --line: #2e3833;
  --accent: #7cc4a6; --accent-soft: #1f3a2f;
  --warn: #e2ac62; --warn-soft: #3a2c19; --info: #8db8e6; --info-soft: #1d2c3d; --good: #8fcf98; --good-soft: #1d3322; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px }
header { grid-column: 1 / -1; padding-block: 32px 8px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between }
h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance }
.sous { color: var(--muted); margin: 6px 0 0; max-width: 64ch }
.recherche { flex: 1 1 280px; max-width: 380px }
.recherche label, .eyebrow { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px }
#q { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg) }
#q:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
nav { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; padding-top: 16px; max-height: 100vh; overflow-y: auto }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
nav ol ol { padding-left: 12px; margin: 2px 0 6px; border-left: 1px solid var(--line) }
nav a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px }
nav > ol > li > a { font-weight: 600 }
nav ol ol a { font-size: 13.5px; color: var(--muted) }
nav a:hover { background: var(--accent-soft) }
nav a span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums }
main { min-width: 0; display: grid; gap: 56px; padding-top: 16px }
.bloc { display: grid; gap: 20px; min-width: 0 }
.bloc > h2 { font-family: var(--serif); font-weight: 600; font-size: 25px; margin: 0; text-wrap: balance }
.bloc > .intro { color: var(--muted); margin: -12px 0 0; max-width: 70ch }
.theme { display: grid; gap: 12px; min-width: 0 }
.theme h3 { font-family: var(--serif); font-weight: 600; font-size: 19px; margin: 8px 0 0; text-wrap: balance }
.fichier { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.cats { display: flex; flex-wrap: wrap; gap: 6px }
code, .cat { font-family: var(--mono); font-size: 12px }
.cat { background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 4px }
article { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0 }
article.obsolete { opacity: .7 }
.tete { display: flex; gap: 12px; align-items: start; justify-content: space-between }
.tete h4 { font-size: 15px; font-weight: 600; margin: 0; text-wrap: balance }
.parent { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .03em; margin-bottom: 2px }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 2px }
.pill.ouvert, .pill.ancienne, .pill.todo { color: var(--warn); background: var(--warn-soft) }
.pill.en_cours { color: var(--info); background: var(--info-soft) }
.pill.corrige { color: var(--good); background: var(--good-soft) }
.pill.equipe { color: var(--accent); background: var(--accent-soft) }
.pill.auto { color: var(--muted); background: var(--bg); border: 1px solid var(--line) }
.contexte { color: var(--muted); font-size: 13.5px; margin: 0; max-width: 75ch }
.contexte strong { color: var(--fg); font-weight: 600 }
.lettre { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding-left: 14px; border-left: 2px solid var(--line); max-width: 68ch }
.lettre a, .contexte a, td a, dd a { color: var(--accent) }
button.copier { flex: none; font: 500 13px var(--sans); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer }
button.copier:hover { background: var(--accent-soft) }
button.copier.ok { color: var(--fg) }
.bug-id { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-weight: 500; margin-right: 6px }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px }
dt { color: var(--muted) }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
dd ul { margin: 0; padding-left: 18px; display: grid; gap: 3px }
.table { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 640px }
th { text-align: left; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg) }
td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere }
tr:first-child td { border-top: 0 }
td.nowrap { white-space: nowrap }
td.num, .num { font-variant-numeric: tabular-nums; color: var(--muted) }
tr.todo td { color: var(--muted) }
.resume { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted) }
.resume b { color: var(--fg); font-variant-numeric: tabular-nums }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px }
.vide { color: var(--muted); font-style: italic }
@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px }
  nav { position: static; max-height: none; padding-top: 0 }
  nav ol { display: flex; flex-wrap: wrap; gap: 6px }
  nav ol ol { display: none }
  nav a { border: 1px solid var(--line); padding: 4px 10px; font-size: 13px }
  h1 { font-size: 25px }
  dl { grid-template-columns: minmax(0, 1fr) } dt { margin-top: 4px }
}
@media (prefers-reduced-motion: no-preference) { button.copier { transition: background .15s } }
</style>

<script>
const D = {"reponses": [{"id": "r-acces-403", "titre": "Accès bloqué ou critique bloquée (erreur 403)", "fichier": "kb/reponses/acces-403.md", "cats": ["acces_bloque_403", "critique_bloquee_403"], "reponses": [{"titre": "Demander l'IP publique", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message, et toutes nos excuses pour ce blocage. Babelio subit en ce moment de nombreuses attaques de robots, et notre système de protection a pu bloquer votre adresse IP par erreur.\n\nPour vous débloquer rapidement, pourriez-vous nous transmettre votre adresse IP publique ? Vous la trouverez en ouvrant une page comme https://www.monip.org depuis l'appareil et le réseau concernés ; la marche à suivre est aussi détaillée ici : https://babelio.freshdesk.com/support/solutions/articles/48001259098-mon-compte-semble-bloqu%C3%A9-adresse-ip-bloqu%C3%A9e\n\nPourriez-vous aussi nous préciser à quelle date et vers quelle heure le blocage s'est produit, et si vous vous connectez depuis l'étranger ou via un VPN ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "IP publique reçue (après déblocage par l'équipe)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVotre IP a été débloquée, cela sera effectif 5 minutes après réception de ce message. Pouvez-vous me confirmer que vous avez dorénavant bien accès au site ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "IP encore bloquée après déblocage (deuxième niveau de blocage)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVotre IP est encore bloquée par un second filtre : nous avons transmis le problème à notre équipe technique.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "IP privée reçue", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci beaucoup pour votre retour rapide. L'adresse que vous nous avez transmise (192.168…) est celle de votre appareil sur votre réseau domestique : elle ne nous permet malheureusement pas de vous débloquer. Pourriez-vous nous envoyer votre adresse IP publique, visible sur https://www.monip.org ? Nous nous en occupons dès réception.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Critique bloquée", "parent": null, "contexte": "", "texte": "Bonjour,\n\nPouvez-vous nous envoyer le texte de votre critique ? Nous vous le renverrons nettoyé des caractères qui bloquent la publication.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "IP ajoutée à la liste autorisée (accès depuis l'étranger ou après blocage)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nNous avons ajouté votre IP à la liste autorisée. Pourriez-vous essayer à nouveau d'accéder au site, éventuellement dans les 5 minutes qui suivent ce message, et nous confirmer que cela fonctionne ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-bugs-lecture", "titre": "Livres lus, dates, doublons, épinglage", "fichier": "kb/reponses/bugs-lecture.md", "cats": ["bug_livres_lus", "bug_doublons_stats"], "reponses": [{"titre": "Totaux différents selon l'écran (BUG-012, en cours)", "parent": null, "contexte": "C'est la réponse de l'équipe, telle quelle : ne rien demander, ne rien expliquer.", "texte": "Bonjour,\n\nNous allons corriger ce bug, merci de votre patience.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Date de début impossible à saisir (BUG-013, en cours)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nNous allons corriger cela. En attendant, vous pouvez passer le livre « En cours » pour faire apparaître la date de début.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Bug corrigé (BUG-001, BUG-002)", "parent": null, "contexte": "Ne rien demander d'autre (ni version, ni lien, ni pseudo) : le lecteur met à jour et revient vers nous si le souci persiste.", "texte": "Bonjour,\n\nNous avons corrigé ce bug : téléchargez la dernière version de l'application, et vous verrez apparaître sur la fiche du livre les dates en double, à supprimer.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Livre lu absent (statut ouvert ou en_cours)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre signalement, et désolés pour ce désagrément : nous savons à quel point votre historique de lecture compte. Depuis la mise en ligne de la nouvelle version, certains livres passés en « lu » n'apparaissent pas dans les dernières lectures, même quand les dates sont correctement renseignées. Nos développeurs ont identifié le problème et travaillent à sa correction.\n\nRassurez-vous, vos lectures et leurs dates ne sont pas perdues : l'affichage se remettra en ordre avec le correctif, sans que vous ayez à les ressaisir. Nous vous écrirons dès qu'il sera en ligne.\n\nEn attendant, si un livre ne remonte pas, vous pouvez essayer de valider à nouveau sa date de fin de lecture.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Épingle impossible à retirer (BUG-010, corrigé)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message ! Ce souci d'épingle a été corrigé dans la dernière version de l'application : après l'avoir mise à jour, vous pourrez retirer l'épingle d'un appui prolongé sur le livre, puis « épingler / désépingler », ou depuis l'écran Wishlist ou Pile à lire.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Lectures en double ou totaux faux (ancienne réponse, BUG-002 n'est plus en cours : ne plus l'utiliser)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci beaucoup pour votre message très précis, qui nous aide vraiment. Il s'agit d'un problème connu depuis la nouvelle version : certaines lectures, en particulier les relectures, sont comptées plusieurs fois dans le journal, les statistiques ou les défis. Inutile de supprimer ou de ressaisir vos dates, cela ne corrige pas le compteur et pourrait vous faire perdre des informations.\n\nNos développeurs y travaillent, et les doublons existants seront corrigés avec le correctif. Nous vous préviendrons dès que ce sera fait, merci pour votre patience !\n\nBelles lectures,\nL'équipe Babelio", "obsolete": true, "cats": []}]}, {"id": "r-corrections-biblio", "titre": "Corrections bibliographiques", "fichier": "kb/reponses/corrections-biblio.md", "cats": ["correction_biblio_simple", "correction_biblio_complexe"], "reponses": [{"titre": "Un auteur envoie de nouvelles couvertures", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVous pouvez ajouter vous-même les couvertures directement sur la fiche de chaque livre. Si vous souhaitez que l'une d'elles devienne la couverture principale d'une édition, indiquez-nous l'EAN de l'édition concernée.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Correction transmise (si une réponse est nécessaire)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci beaucoup pour votre signalement ! Nous avons bien noté la correction ([champ] : [valeur]) pour « [titre] » et la transmettons à l'équipe qui met à jour la base.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Correction effectuée", "parent": null, "contexte": "À n'utiliser que lorsque la correction a réellement été faite.", "texte": "Bonjour,\n\nMerci beaucoup pour votre contribution, c'est grâce à des lecteurs attentifs comme vous que la base de Babelio reste fiable ! La correction ([champ] : [valeur]) a bien été appliquée sur la fiche « [titre] ».\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Couverture affichée incorrecte (une édition à mettre à jour)", "parent": "Couvertures", "contexte": "", "texte": "Bonjour,\n\nSi la couverture affichée sur Babelio n'est pas correcte, vous devez :\n\n- ajouter la nouvelle couverture depuis la fiche du livre ;\n- nous envoyer l'URL de l'image sur Babelio une fois la couverture ajoutée, pour que nous la passions comme couverture principale.\n\nMerci.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Retirer une couverture erronée", "parent": "Couvertures", "contexte": "", "texte": "Bonjour,\n\nMerci pour votre signalement. Pour que nous retirions la bonne couverture, pourriez-vous nous envoyer son adresse ? Faites un clic droit sur la couverture (ou un appui long sur téléphone), choisissez « Copier l'adresse de l'image », puis collez-la dans votre réponse, avec le lien de la fiche du livre.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Anciennes couvertures encore visibles", "parent": "Couvertures", "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message ! Les couvertures que vous avez remplacées ne sont plus affichées. Celles qui restent visibles appartiennent à d'autres éditions du livre, que nous conservons.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Information manquante", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci beaucoup pour votre signalement ! Pour que nous puissions effectuer la correction, pourriez-vous nous indiquer [la bonne valeur : format, nombre de pages… / l'EAN ou l'ISBN de l'édition / le lien de la fiche] ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Relance sur une correction déjà transmise (#35958)", "parent": null, "contexte": "Le lecteur relance pour une correction déjà demandée et en attente : ne rien redemander ni retransmettre.", "texte": "Bonjour,\n\nNous avons beaucoup de demandes à traiter : merci de patienter sans relancer, cela ne fait que rallonger le temps de traitement.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Le lecteur ne sait pas ce qu'est l'adresse (URL) de la fiche (#36903)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nNous recevons trop de demandes pour un traitement manuel et avons besoin de l'adresse de la page de chaque livre concerné : c'est l'adresse qui s'affiche dans la barre du navigateur, par exemple https://www.babelio.com/livres/Chabot-Le-fileur-dorties/2145246\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-ajout-livre", "titre": "Ajouter un livre absent de Babelio", "fichier": "kb/reponses/ajout-livre.md", "cats": ["ajout_livre"], "reponses": [{"titre": "Livre absent", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message, et merci de contribuer à enrichir Babelio !\n\nVous pouvez ajouter ce livre vous-même en quelques instants : via son ISBN sur https://www.babelio.com/ajoutISBN.php, ou, s'il n'a pas d'ISBN ou n'est pas trouvé, en saisissant ses informations sur https://www.babelio.com/ajoutlivres.php. Il apparaîtra ensuite dans la base et vous pourrez l'ajouter à votre bibliothèque.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "La couverture n'est pas acceptée", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message. Le plus simple est d'ajouter d'abord le livre sans couverture, puis de retourner sur sa fiche et de cliquer sur « ajouter une couverture ». Le fichier doit être au format jpg ou png (le format webp n'est pas accepté) et peser moins de 400 Ko : une capture d'écran de la couverture fait souvent très bien l'affaire.\n\nSi cela ne fonctionne toujours pas, n'hésitez pas à nous envoyer la couverture avec le lien de la fiche du livre, et nous l'ajouterons pour vous.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Édition manquante d'un livre déjà présent sur Babelio", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVous pouvez librement ajouter les éditions manquantes depuis la page d'ajout de livres (https://www.babelio.com/ajoutlivres.php) ou depuis l'application. Elles seront ensuite associées à celle déjà présente sur Babelio.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-auteurs", "titre": "Auteurs et éditeurs", "fichier": "kb/reponses/auteurs.md", "cats": ["fiche_auteur_editeur"], "reponses": [{"titre": "Un auteur veut modifier sa biographie ou sa page", "parent": null, "contexte": "L'auteur la modifie lui-même (#36816) :", "texte": "Bonjour,\n\nVous pouvez modifier votre page auteur en cliquant sur « Ajouter des informations », puis sur « Modifier les informations ».\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Rattacher son compte à sa page auteur, « je suis l'auteur » (#36967, #36886)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nSur Babelio, la page auteur est différente du compte lecteur :\n- la page auteur référence vos livres, et vous ne pouvez pas vous y connecter ;\n- le compte lecteur vous permet d'ajouter des livres à votre bibliothèque, d'écrire des critiques, d'interagir avec la communauté et d'apporter des modifications à votre page auteur.\n\nConnecté à votre compte lecteur, vous modifiez votre page auteur en cliquant sur « Ajouter des informations », puis « Modifier les informations ». Si vous n'avez pas encore de compte, il vous suffit de vous inscrire.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Page auteur en doublon ou nom mal saisi", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre signalement ! Pourriez-vous nous envoyer les liens des deux pages auteurs à associer ? Nous les regrouperons sous le bon nom.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Retirer une photo de la page auteur", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message. Pour que nous retirions la bonne photo, pourriez-vous nous envoyer son adresse ? Faites un clic droit sur la photo (ou un appui long sur téléphone), choisissez « Copier l'adresse de l'image », puis collez-la dans votre réponse.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Demande de retrait de fiches (livres, page auteur) ou de critiques", "parent": null, "contexte": "Un auteur demande le retrait de ses livres ou de sa page auteur, ou la suppression d'une critique négative.", "texte": "Bonjour,\n\nMalheureusement nous ne pouvons pas :\n- supprimer les fiches de vos livres. Les livres sur Babelio ont été lus par des membres de la communauté, nous demander de les supprimer reviendrait à les retirer de leurs bibliothèques ; plus d'informations sur la suppression de livre ;\n- supprimer vos fiches auteurs. Les contenus biographiques sont autorisés sur Babelio dès lors qu'ils respectent les principes d'encyclopédisme. Pour cela nous nous référons au modèle de Wikipédia : https://fr.wikipedia.org/wiki/Wikip%C3%A9dia:Biographie_de_personne_vivante ;\n- supprimer une critique négative. Les membres de Babelio sont libres de critiquer, c'est ce qui fait la légitimité du site, et nous ne pouvons supprimer des contenus que s'ils enfreignent nos conditions d'utilisation.\n\nSi un livre a été réédité, nous ne pourrons pas supprimer l'édition antérieure. En revanche, vous pouvez ajouter la nouvelle édition et l'associer à l'ancienne en faisant la demande sur le forum.\n\nMerci de votre compréhension.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Un auteur demande la suppression de sa page auteur au nom du RGPD", "parent": null, "contexte": "Un auteur invoque le RGPD, le droit à l'effacement ou ses données personnelles pour obtenir la suppression de sa page auteur (catégorie `fiche_auteur_editeur`, ou `vie_privee` s'il ne parle que de ses données). Babelio ne supprime pas les pages auteurs. Il est possible de corriger une information erronée, de modifier la biographie ou de retirer des photos, rien de plus. Si le message mentionne un avocat, la CNIL ou une mise en demeure (`demande_juridique`), la réponse reste préparée mais l'équipe décide.", "texte": "Bonjour,\n\nMerci pour votre message.\n\nNous ne supprimons pas les pages auteurs. Comme les notices de Wikipédia ou des catalogues de bibliothèques, elles relèvent de l'information du public sur des œuvres publiées : elles indiquent qui a écrit quels livres, et permettent aux lecteurs de les retrouver et d'en parler. Pour cela nous nous référons au modèle de Wikipédia : https://fr.wikipedia.org/wiki/Wikip%C3%A9dia:Biographie_de_personne_vivante\n\nEn revanche, nous pouvons :\n- corriger toute information erronée ;\n- modifier ou réduire la biographie ;\n- retirer les photos de votre page auteur.\n\nVous pouvez faire ces modifications vous-même depuis un compte lecteur, en cliquant sur « Ajouter des informations », puis sur « Modifier les informations » sur votre page auteur. Vous pouvez aussi nous indiquer ce qui doit être corrigé ou retiré, et nous nous en chargerons.\n\nMerci de votre compréhension.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Éditeur qui veut compléter sa page éditeur ou ajouter ses nouveautés (#36987)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVous pouvez ajouter librement vos nouveautés à la base de données Babelio en créant votre compte sur le site.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Photo d'auteur retirée, l'auteur peut en ajouter une", "parent": null, "contexte": "", "texte": "Bonjour,\n\nLa photo a bien été supprimée de votre page auteur. Vous pouvez ajouter vos propres images en cliquant sur « Ajouter une photo ».\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-moderation", "titre": "Signalement d'une critique, d'un commentaire ou d'un membre", "fichier": "kb/reponses/moderation.md", "cats": ["moderation"], "reponses": [{"titre": "Variante 1 : contenu conforme", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci d'avoir pris le temps de nous signaler ce contenu : votre vigilance nous aide à garder Babelio agréable pour tous.\n\nAprès examen, ce contenu n'enfreint pas notre politique de modération, que vous pouvez consulter ici : https://www.babelio.com/article/1549/De-la-politique-de-moderation-des-critiques-sur-Ba. Nous comprenons qu'il ait pu vous heurter, et nous restons attentifs à la suite des échanges.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Variante 2 : contenu modéré", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci d'avoir pris le temps de nous signaler ce contenu : votre vigilance nous aide à garder Babelio agréable pour tous.\n\nAprès examen, ce contenu enfreint bien notre politique de modération (https://www.babelio.com/article/1549/De-la-politique-de-moderation-des-critiques-sur-Ba) et a été retiré.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Comportement méprisant ou harcelant d'un autre membre, sans critère de signalement", "parent": null, "contexte": "À utiliser lorsque le lecteur signale un membre dont les commentaires sont méprisants ou répétitifs, sans relever d'une catégorie de signalement (appel à la haine, spam, faux compte). Le blocage est la première mesure proposée. Ne pas reprendre les propos du membre signalé.", "texte": "Bonjour,\n\nDans un premier temps, nous vous recommandons de bloquer cette personne depuis son profil (« ... » puis « bloquer ce membre »). Elle ne pourra plus commenter vos critiques.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-trigger-warning", "titre": "Signalement d'un trigger warning", "fichier": "kb/reponses/trigger-warning.md", "cats": ["trigger_warning"], "reponses": [{"titre": "Signalement sans explication (#32737, #34733)", "parent": null, "contexte": "Le commentaire est vide (« (sans texte) »), ou dit seulement « c'est faux » sans dire pourquoi. Ne pas proposer d'action, et **toujours** proposer cette réponse dans `reponse_proposee` (jamais `null`), même si l'avertissement semble discutable : c'est au lecteur de dire ce qui ne va pas. Si l'avertissement lui-même révèle l'intrigue (spoiler évident), le signaler à l'équipe dans `resume`.", "texte": "Bonjour,\n\nMerci pour votre signalement. Pouvez-vous nous préciser ce qui ne va pas avec cet avertissement ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-masse-critique", "titre": "Masse Critique", "fichier": "kb/reponses/masse-critique.md", "cats": ["masse_critique"], "reponses": [{"titre": "Question sur la participation", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message et pour votre intérêt pour Masse Critique !\n\nVous trouverez toutes les explications dans cet article : https://www.babelio.com/article/1542/Tout-ce-quil-faut-savoir-sur-Masse-Critique. Rassurez-vous, une première participation ne vous exclut pas des suivantes, bien au contraire : cela vous donne même plus de chances ! Il faut simplement avoir déjà publié des critiques sur Babelio.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Problème d'envoi ou de réception", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message, nous allons regarder cela avec vous. Pourriez-vous nous préciser s'il s'agit d'une Masse Critique mensuelle ou privilégiée, ainsi que le titre du livre concerné ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-divers", "titre": "Autres réponses types", "fichier": "kb/reponses/divers.md", "cats": [], "reponses": [{"titre": "Demande d'évolution, ou regret d'une fonction disparue", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci beaucoup pour votre message et pour cette suggestion, [reprendre l'idée en une phrase]. Nous avons de nombreux projets en cours, mais nous avons bien ajouté votre proposition à la liste des développements futurs que nous allons étudier.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["demande_evolution"]}, {"titre": "Félicitations", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci beaucoup pour votre message, il fait très plaisir à toute l'équipe ! N'hésitez pas à nous écrire si vous voyez encore des choses à améliorer.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["retour_positif"]}, {"titre": "Changer son pseudo, son email ou son mot de passe", "parent": null, "contexte": "", "texte": "Bonjour,\n\nMerci pour votre message ! Vous pouvez faire ce changement vous-même : connectez-vous à votre compte, puis rendez-vous sur la page des paramètres (https://www.babelio.com/modif_params.php). Vous y trouverez la modification de votre identifiant (https://www.babelio.com/modif_login.php), de votre adresse email (https://www.babelio.com/modif_mail.php) et de votre mot de passe (https://www.babelio.com/modif_mdp.php).\n\nTout est également expliqué pas à pas dans cet article : https://babelio.freshdesk.com/support/solutions/articles/48001173059-comment-modifier-son-adresse-email-identifiant-ou-son-mot-de-passe\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["question_usage"]}, {"titre": "Pseudo automatique", "parent": "Comptes créés avec Apple (« Se connecter avec Apple »)", "contexte": "", "texte": "Bonjour,\n\nCe pseudo a été créé automatiquement lors de votre inscription avec Apple. Vous pouvez le changer ici, une fois connecté : https://www.babelio.com/modif_login.php\n\nPour vous connecter, voici comment trouver votre email de relais privé Apple : https://babelio.freshdesk.com/support/solutions/articles/48001267282-comment-trouver-votre-email-de-relais-priv%C3%A9-apple\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["question_usage"]}, {"titre": "Connexion impossible avec un pseudo créé par Apple", "parent": "Comptes créés avec Apple (« Se connecter avec Apple »)", "contexte": "Le lecteur ne peut plus se connecter et son pseudo a la forme `xxxxxxxxxx_1234567890123`. **Récupérer le radical de l'identifiant, c'est-à-dire tout ce qui précède le `_`** (`zb7hw4pbdd` dans `zb7hw4pbdd_1719691861049`), puis lui ajouter `@privaterelay.appleid.com` : c'est l'adresse relais du lecteur, à écrire dans la réponse à la place de l'exemple. Ne rien demander.", "texte": "Bonjour,\n\nVotre compte a été créé avec « Se connecter avec Apple ». Dans ce cas, Apple ne nous transmet pas votre adresse email habituelle mais une adresse relais privée, qui vous fait suivre nos messages : la vôtre est sans doute zb7hw4pbdd@privaterelay.appleid.com (votre pseudo est formé à partir d'elle). Aucun mot de passe n'a été créé à votre inscription, c'est pourquoi vous ne le connaissez pas.\n\nPour en définir un, cliquez sur « Mot de passe oublié » sur la page de connexion et saisissez cette adresse relais : le lien de réinitialisation arrivera dans la boîte mail de votre identifiant Apple (pensez à vérifier les spams). Si cette adresse ne fonctionne pas, vous pouvez retrouver la vôtre en suivant ce guide : https://babelio.freshdesk.com/support/solutions/articles/48001267282-comment-trouver-votre-email-de-relais-priv%C3%A9-apple\n\nUne fois connecté, vous pourrez changer votre pseudo ici : https://www.babelio.com/modif_login.php\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["connexion_compte"]}, {"titre": "Retrouver l'accès à un compte Apple", "parent": "Comptes créés avec Apple (« Se connecter avec Apple »)", "contexte": "Catégorie `connexion_compte` (et non `recuperation_compte`) dès que le lecteur a créé son compte avec Apple, même s'il demande une fusion ou un rattachement à un autre email : cette réponse règle le cas sans intervention de l'équipe.", "texte": "Bonjour,\n\nMerci pour votre message. Votre compte est associé à une adresse relais Apple (…@privaterelay.appleid.com) : il vous suffit de redemander un mot de passe via le lien « Mot de passe oublié » en saisissant cette adresse. Pour la retrouver, suivez ce guide : https://babelio.freshdesk.com/support/solutions/articles/48001267282-comment-trouver-votre-email-de-relais-priv%C3%A9-apple\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["connexion_compte"]}, {"titre": "L'application ne fonctionne pas bien (bug sur iPhone ou Android sans bug connu correspondant)", "parent": null, "contexte": "", "texte": "Bonjour,\n\nAvez-vous toujours le souci avec la dernière version de l'application ?\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Bug propre au lecteur, impossible à reproduire ni à comprendre sans le voir", "parent": null, "contexte": "Réservé aux bugs que l'équipe ne peut pas constater elle-même (compte ou appareil du lecteur). Sinon, ne pas demander de capture.", "texte": "Bonjour,\n\nMerci pour votre signalement. Pour bien comprendre ce qui se passe, pourriez-vous nous envoyer une capture d'écran (ou une courte vidéo) du problème, et nous préciser si vous utilisez le site sur ordinateur ou l'application ? Nous pourrons ainsi le transmettre à nos développeurs.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": ["bug_nouveau"]}, {"titre": "Application téléchargée hors Play Store (Aurora Store, etc.)", "parent": null, "contexte": "", "texte": "Bonjour,\nNous ne pourrons pas permettre le téléchargement en dehors des circuits de téléchargements classiques (Play Store ou Apple Store), notamment car l'application utilise des certificats Google.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Calcul de la note moyenne d'un livre", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVous trouverez plus d'informations à propos du calcul des notes moyennes par ici : https://www.babelio.com/article/3205/\n\nBien à vous,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Pseudo déjà utilisé à l'inscription", "parent": null, "contexte": "", "texte": "Bonjour,\n\nVous pouvez ajouter deux ou trois chiffres à la suite du pseudo souhaité pour vous démarquer des autres membres.\n\nSi vous avez essayé plusieurs pseudos marqués « déjà utilisés », pourriez-vous nous en indiquer quelques-uns ? Cela nous aidera à vérifier.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}, {"titre": "Bouton « Publier » grisé, critique trop courte", "parent": null, "contexte": "", "texte": "Bonjour,\n\nLes critiques doivent comporter au moins 250 caractères pour pouvoir être publiées : c'est pourquoi le bouton reste grisé. Nous allons faire évoluer cette limite à l'avenir.\n\nBelles lectures,\nL'équipe Babelio", "obsolete": false, "cats": []}]}, {"id": "r-infos-a-demander", "titre": "Informations à demander au lecteur", "fichier": "kb/reponses/infos-a-demander.md", "cats": [], "reponses": [{"titre": "Problème propre à son compte, que l'équipe ne peut pas reproduire de son côté : livres ou critiques disparus, statistiques fausses, défi, étagères", "contexte": "Demander : le **pseudo Babelio**", "texte": "Pourriez-vous nous indiquer votre pseudo Babelio, afin que nous puissions regarder directement votre compte ?", "obsolete": false, "cats": []}, {"titre": "Problème sur un livre (fiche, édition, couverture, livre manquant dans une liste)", "contexte": "Demander : le **lien de la fiche du livre**", "texte": "Pourriez-vous nous envoyer le lien de la fiche du livre concerné ?", "obsolete": false, "cats": []}, {"titre": "Correction d'une édition précise", "contexte": "Demander : l'**ISBN / EAN** de l'édition", "texte": "Pourriez-vous nous indiquer l'ISBN de l'édition concernée ?", "obsolete": false, "cats": []}, {"titre": "Problème sur une page précise (critique, liste, profil d'un autre membre, défi)", "contexte": "Demander : le **lien de la page**", "texte": "Pourriez-vous nous envoyer le lien de la page où vous rencontrez le problème ?", "obsolete": false, "cats": []}, {"titre": "Retrait d'une photo d'auteur ou d'une couverture", "contexte": "Demander : l'**adresse de l'image** (elle suffit pour une photo d'auteur ; pour une couverture, aussi le lien de la fiche)", "texte": "Pour que nous retirions la bonne image, pourriez-vous nous envoyer son adresse ? Faites un clic droit sur l'image (ou un appui long sur téléphone), choisissez « Copier l'adresse de l'image », puis collez-la dans votre réponse.", "obsolete": false, "cats": []}, {"titre": "Bug propre au lecteur (son compte, son appareil), que l'équipe ne peut pas reproduire, et dont le symptôme reste flou", "contexte": "Demander : une **capture d'écran** (ou une vidéo)", "texte": "Pourriez-vous nous envoyer une capture d'écran (ou une courte vidéo) du problème ? Cela nous aidera beaucoup à comprendre ce qui se passe.", "obsolete": false, "cats": []}, {"titre": "Bug qui peut dépendre de l'appareil", "contexte": "Demander : la **plateforme**", "texte": "Utilisez-vous le site sur ordinateur, ou l'application sur iPhone ou Android ?", "obsolete": false, "cats": []}]}], "bugs": [{"id": "BUG-004", "titre": "Livres affichés plusieurs fois (jusqu'à ×10) dans les étagères", "statut": "ouvert", "note": "", "date": "", "plateformes": ["ios"], "symptomes": ["livres en plusieurs exemplaires dans ses étagères et sur les profils des autres"], "contournement": "", "hypothese": "", "version": "3.0.145.0", "tickets": [37, 111]}, {"id": "BUG-005", "titre": "Les « j'aime » ne restent pas affichés après rechargement", "statut": "ouvert", "note": "", "date": "", "plateformes": ["site"], "symptomes": [], "contournement": "", "hypothese": "", "version": "", "tickets": [7, 42, 131]}, {"id": "BUG-006", "titre": "Note affichée 0/5 sur certaines fiches livre", "statut": "ouvert", "note": "", "date": "", "plateformes": ["site"], "symptomes": [], "contournement": "", "hypothese": "", "version": "", "tickets": [72, 146]}, {"id": "BUG-007", "titre": "Saisie de l'année impossible dans le champ date de lecture", "statut": "ouvert", "note": "", "date": "", "plateformes": ["site_opera", "sit const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let Q = "", NQ = "";
function riche(s) {
  let h = esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+[^\s<).,;:])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  if (Q) h = h.replace(new RegExp("(" + Q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
  return h;
}
const garde = (...champs) => !NQ || norm(champs.flat().join(" ")).includes(NQ);
const STATUTS = {ouvert: "Ouvert", en_cours: "En cours", corrige: "Corrigé"};
const tickets = l => l.filter(t => t > 1000).map(t => "#" + t).join(", ") || (l.length ? `${l.length} tickets d'octobre` : "—");

function rendre() {
  Q = document.getElementById("q").value.trim(); NQ = norm(Q);
  let nav = "", main = "", total = 0;

  // Réponses types

  for (const t of D.reponses) {
    const reps = t.reponses.filter(r => garde(r.titre, r.texte, r.contexte, r.parent || "", r.cats, t.titre));
    if (NQ && !reps.length) continue;
    nr += reps.length;
    sousnav += `<li><a href="#${t.id}">${esc(t.titre)}<span>${reps.length}</span></a></li>`;
    corps += `<section class="theme" id="${t.id}"><div><h3>${esc(t.titre)}</h3><span class="fichier">${t.fichier}</span></div>`
      + (t.cats.length ? `<div class="cats">${t.cats.map(c => `<span class="cat">${c}</span>`).join("")}</div>` : "")
      + reps.map(r => `<article class="${r.obsolete ? "obsolete" : ""}">
          <div class="tete"><h4>${r.parent ? `<span class="parent">${esc(r.parent)}</span>` : ""}${riche(r.titre)}${r.obsolete ? ' <span class="pill ancienne">Ancienne</span>' : ""}</h4>
          <button class="copier" type="button" data-t="${t.id}" data-i="${t.reponses.indexOf(r)}">Copier</button></div>
          ${r.cats.length ? `<div class="cats">${r.cats.map(c => `<span class="cat">${c}</span>`).join("")}</div>` : ""}
          ${r.contexte ? `<p class="contexte">${riche(r.contexte)}</p>` : ""}
          <p class="lettre">${riche(r.texte)}</p></article>`).join("") + `</section>`;
  }
  if (nr) {
    total += nr;
    nav += `<li><a href="#reponses">Réponses types<span>${nr}</span></a><ol>${sousnav}</ol></li>`;
    main += `<section class="bloc" id="reponses"><h2>Réponses types</h2><p class="intro">Les réponses que l'agent reprend, presque mot pour mot, dans ses propositions. Le bouton Copier prend le texte destiné au lecteur.</p>${corps}</section>`;
  }

  // Bugs
  const bugs = D.bugs.filter(b => garde(b.id, b.titre, b.symptomes, b.contournement, b.hypothese, b.note, STATUTS[b.statut], b.plateformes));
  if (bugs.length) {
    total += bugs.length;
    const n = s => D.bugs.filter(b => b.statut === s).length;
    nav += `<li><a href="#bugs">Bugs connus<span>${bugs.length}</span></a></li>`;
    main += `<section class="bloc" id="bugs"><h2>Bugs connus</h2>
      <p class="intro">Fichier <code>kb/bugs.yaml</code>. L'agent n'annonce jamais un correctif que ce fichier n'indique pas ; la routine d'apprentissage passe un bug en « corrigé », avec la date, quand l'équipe l'écrit à un lecteur.</p>
      <div class="resume"><span><b>${n("ouvert")}</b> ouverts</span><span><b>${n("en_cours")}</b> en cours</span><span><b>${n("corrige")}</b> corrigés</span></div>`
      + bugs.map(b => `<article>
          <div class="tete"><h4><span class="bug-id">${esc(b.id)}</span>${riche(b.titre)}</h4><span class="pill ${b.statut}">${STATUTS[b.statut] || esc(b.statut)}</span></div>
          <dl>
            <dt>Plateformes</dt><dd>${esc(b.plateformes.join(", "))}${b.version ? ` (version ${esc(b.version)})` : ""}</dd>
            ${b.symptomes.length ? `<dt>Symptômes</dt><dd><ul>${b.symptomes.map(s => `<li>${riche(s)}</li>`).join("")}</ul></dd>` : ""}
            ${b.contournement ? `<dt>Contournement</dt><dd>${riche(b.contournement)}</dd>` : ""}
            ${b.hypothese ? `<dt>Hypothèse</dt><dd>${riche(b.hypothese)}</dd>` : ""}
            ${b.note || b.date ? `<dt>Statut</dt><dd>${b.date ? `corrigé le ${esc(b.date)}. ` : ""}${riche(b.note)}</dd>` : ""}
            <dt>Tickets</dt><dd class="num">${esc(tickets(b.tickets))}</dd>
          </dl></article>`).join("") + `</section>`;
  }

  // Interface
  const faq = D.interface.filter(f => garde(f.cherche, f.ou, f.tickets));
  if (faq.length) {
    total += faq.length;
    const todo = D.interface.filter(f => f.todo).length;
    nav += `<li><a href="#interface">Où trouver quoi<span>${faq.length}</span></a></li>`;
    main += `<section class="bloc" id="interface"><h2>Où trouver quoi dans la nouvelle interface</h2>
      <p class="intro">Fichier <code>kb/interface-faq.md</code>. ${todo} lignes sont encore à compléter par l'équipe : tant qu'elles sont vides, le ticket part en validation.</p>
      <div class="table"><table><thead><tr><th>Le lecteur cherche</th><th>Où c'est maintenant</th><th>Tickets</th></tr></thead><tbody>`
      + faq.map(f => `<tr class="${f.todo ? "todo" : ""}"><td>${riche(f.cherche)}</td><td>${f.todo ? `<span class="pill todo">À compléter</span> ${riche(f.ou.replace(/^TODO\s*/, ""))}` : riche(f.ou)}</td><td class="num">${riche(f.tickets)}</td></tr>`).join("")
      + `</tbody></table></div></section>`;
  }

  // Catégories
  const cats = D.categories.filter(c => garde(c.id, c.reconnaitre, c.exemples));
  if (cats.length) {
    total += cats.length;
    nav += `<li><a href="#categories">Catégories<span>${cats.length}</span></a></li>`;
    main += `<section class="bloc" id="categories"><h2>Catégories de tickets</h2>
      <p class="intro">Fichier <code>kb/categories.md</code>. L'agent classe chaque ticket dans l'une d'elles ; <code>policy.yaml</code> décide ensuite ce qui part en validation ou chez un humain. Le tag Freshdesk correspondant est <code>ia-cat-</code> suivi de l'identifiant.</p>
      <div class="table"><table><thead><tr><th>Identifiant</th><th>Comment la reconnaître</th><th>Volume</th></tr></thead><tbody>`
      + cats.map(c => `<tr><td class="nowrap"><span class="cat">${esc(c.id)}</span></td><td>${riche(c.reconnaitre)}</td><td class="num nowrap">${esc(c.volume)}</td></tr>`).join("")
      + `</tbody></table></div></section>`;
  }

  // Tags
  const tags = D.tags.filter(t => garde(t.tag, t.role, t.quand, t.par));
  if (tags.length) {
    total += tags.length;
    nav += `<li><a href="#tags">Tags Freshdesk<span>${tags.length}</span></a></li>`;
    main += `<section class="bloc" id="tags"><h2>Tags Freshdesk</h2>
      <p class="intro">Freshdesk sert de mémoire à Autofresh : ces tags disent ce qui a été fait sur chaque ticket. Ceux de l'équipe sont des commandes ; ceux d'Autofresh ne sont pas à poser à la main.</p>
      <div class="table"><table><thead><tr><th>Tag</th><th>Posé par</th><th>Signification</th><th>Quand</th></tr></thead><tbody>`
      + tags.map(t => `<tr><td class="nowrap"><code>${riche(t.tag)}</code></td><td class="nowrap"><span class="pill ${t.par === "Équipe" ? "equipe" : "auto"}">${esc(t.par)}</span></td><td>${riche(t.role)}</td><td>${riche(t.quand)}</td></tr>`).join("")
      + `</tbody></table></div></section>`;
  }

  document.getElementById("nav").innerHTML = nav;
  document.getElementById("main").innerHTML = main || `<p class="vide">Rien ne contient « ${esc(Q)} ».</p>`;
  const nrep = D.reponses.reduce((n, t) => n + t.reponses.length, 0);
  document.getElementById("compte").innerHTML = NQ
    ? `${total} résultat${total > 1 ? "s" : ""} pour « ${esc(Q)} ».`
    : `${nrep} réponses types, ${D.bugs.length} bugs, ${D.interface.length} repères d'interface et ${D.categories.length} catégories : ce que l'agent sait, tel qu'il figure dans <code>kb/</code> au ${D.date}.`;
}
document.getElementById("q").addEventListener("input", rendre);
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest("button.copier"); if (!b) return;
  const t = D.reponses.find(x => x.id === b.dataset.t).reponses[+b.dataset.i].texte;
  const fini = ok => { b.textContent = ok ? "Copié" : "Texte sélectionné"; b.classList.add("ok");
    setTimeout(() => { b.textContent = "Copier"; b.classList.remove("ok") }, 1600) };
  const selection = () => { const p = b.closest("article").querySelector(".lettre"); const r = document.createRange();
    r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); fini(false) };
  try { navigator.clipboard.writeText(t).then(() => fini(true), selection) } catch (_) { selection() }
});
rendre();
</script>
